name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: demo
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Load demo schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d demo -v ON_ERROR_STOP=1 -f deploy/postgres/init.sql
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - run: go vet ./...
      - name: Tests (with Postgres integration)
        run: go test -race ./...
        env:
          PG_TEST_URL: postgres://saferotate:saferotate-demo-pw@localhost/demo?sslmode=disable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  demo-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: make demo-up
      - name: Rotate under load, zero failed requests
        run: ./scripts/demo.sh rotate
      - name: App that never reloads blocks the revoke
        run: ./scripts/demo.sh stale
      - name: Error spike triggers rollback
        run: ./scripts/demo.sh chaos
      - name: Audit report
        if: always()
        run: make demo-report | tee audit-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: audit-report, path: audit-report.md }
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile stale logs --tail 100
      - if: always()
        run: make demo-down
